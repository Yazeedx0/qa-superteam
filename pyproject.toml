[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-superteam"
version = "0.1.0"
description = "Deterministic execution, evidence and release-policy tooling behind the QA Superteam agent skills."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []  # the core is stdlib-only by design (see docs/design-decisions.md)

[project.optional-dependencies]
judge = ["anthropic"]
dev = ["pytest>=8", "jsonschema>=4", "ruff>=0.6"]

[project.scripts]
qast = "qa_superteam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: runs real external tools (pytest subprocesses, Playwright, k6, node)",
]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["examples", "evals/ground_truth"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007"]
